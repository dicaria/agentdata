[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdata"
# keep in sync with agentdata/__init__.py __version__ (0.1.10 split-brain lesson; 0.2.1/0.2.2 missed this spot; a trailing comment on the version line breaks site/docs-app gen/openapi.mjs whole-line regex — keep the version line a bare value)
version = "0.3.12"
description = "AgentData domain API SDK — corpus (hosted) + third-party enrichment (local, keyless); stdlib-only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "dicaria", email = "contact@dicaria.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
agentdata = "agentdata.cli:main"
healthcare = "agentdata.entries:healthcare"
company = "agentdata.entries:company"
esg = "agentdata.entries:esg"
legal = "agentdata.entries:legal"
procurement = "agentdata.entries:procurement"   # seventh domain (0.3.0)
research = "agentdata.entries:research"   # registered late (missing at 0.2.2, added 0.2.4)
security = "agentdata.entries:security"   # registered late (missing at 0.2.2, added 0.2.4)

[tool.setuptools]
packages = ["agentdata", "agentdata.healthcare", "agentdata.company", "agentdata.esg", "agentdata.legal", "agentdata.procurement", "agentdata.research", "agentdata.security"]
